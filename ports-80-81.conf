# Custom Configuration for Port 80 and 81
# Generated for Talisman Server Deployment

Listen 80
Listen 81

# PORT 80: MAIN WEBSITE & PHPMYADMIN
<VirtualHost *:80>
    ServerName www.talismanofcouragev2.online
    DocumentRoot /var/www/html/
    <Directory /var/www/html/>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName db123.talismanofcouragev2.online
    DocumentRoot /usr/share/phpMyAdmin/
    <Directory /usr/share/phpMyAdmin/>
        AddDefaultCharset UTF-8
        Require all granted
    </Directory>
</VirtualHost>

# PORT 81: GAME PATCHER
<VirtualHost *:81>
    ServerName patch.talismanofcouragev2.online
    DocumentRoot /var/www/patch/
    <Directory /var/www/patch/>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
